<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆうすちゃん ブロック崩し</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #instructions {
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            color: #00FFFF;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ゆうすちゃん ブロック崩し</h1>
    <div id="instructions">
        【操作方法】<br>
        左に移動: <span class="highlight">← キー</span> または <span class="highlight">A キー</span><br>
        右に移動: <span class="highlight">→ キー</span> または <span class="highlight">D キー</span><br>
        <br>
        残機: <span id="lives" style="color: #FF69B4; font-size: 18px; font-weight: bold;">3</span>
    </div>
    
    <canvas id="gameCanvas" width="500" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const livesDisplay = document.getElementById("lives");

        // ==========================================
        // 1. 画像の読み込み（すべてPNG形式に対応）
        // ==========================================
        const img1 = new Image(); 
        img1.src = 'img_01.png'; // 1枚目：初期状態（衣装がブロックになる）
        
        const img2 = new Image(); 
        img2.src = 'img_02.png'; // 2枚目：差分（背景として露出する）
        
        const img3 = new Image(); 
        img3.png = 'img_03.png'; // 3枚目：失敗時の顔（顔部分に上書き）
        // ※3枚目の読み込み用
        const img3Actual = new Image();
        img3Actual.src = 'img_03.png';

        // ==========================================
        // 2. ゲーム変数の設定
        // ==========================================
        let lives = 3;
        let gameState = "START"; // START, PLAYING, GAMEOVER, CLEAR
        
        // パドルの設定
        const paddle = {
            height: 12,
            width: 90,
            x: (canvas.width - 90) / 2,
            y: canvas.height - 30,
            dx: 7
        };

        // ボールの設定（10分ほどでまったり遊べる速さに調整）
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 7,
            dx: 3,
            dy: -3
        };

        // ブロックの設定（衣装の配置に合わせた標準的なグリッド）
        const blockRowCount = 8;
        const blockColumnCount = 7;
        const blockWidth = 60;
        const blockHeight = 35;
        const blockPadding = 3;
        const blockOffsetTop = 160;  // 衣装がある位置（Y座標）
        const blockOffsetLeft = 32; // 左右の余白

        // ブロック配列の初期化
        let blocks = [];
        for(let c=0; c<blockColumnCount; c++) {
            blocks[c] = [];
            for(let r=0; r<blockRowCount; r++) {
                blocks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // キーボード入力の状態管理
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                rightPressed = true;
            }
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                leftPressed = true;
            }
            
            // START画面でキーを押したらゲーム開始
            if(gameState === "START" && (rightPressed || leftPressed)) {
                gameState = "PLAYING";
            }
        });

        document.addEventListener("keyup", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                rightPressed = false;
            }
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                leftPressed = false;
            }
        });

        // ==========================================
        // 3. 描画・ゲームロジック
        // ==========================================

        // ブロックの描画（1枚目の画像から切り出す）
        function drawBlocks() {
            for(let c=0; c<blockColumnCount; c++) {
                for(let r=0; r<blockRowCount; r++) {
                    if(blocks[c][r].status === 1) {
                        let blockX = (c * (blockWidth + blockPadding)) + blockOffsetLeft;
                        let blockY = (r * (blockHeight + blockPadding)) + blockOffsetTop;
                        blocks[c][r].x = blockX;
                        blocks[c][r].y = blockY;

                        // 1枚目の画像からブロックの範囲を切り取って描画
                        ctx.drawImage(img1, 
                            blockX, blockY, blockWidth, blockHeight, // 元画像から切り出す位置とサイズ
                            blockX, blockY, blockWidth, blockHeight  // キャンバスに描画する位置とサイズ
                        );
                        
                        // ブロックの形を明確にするための白い枠線
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.lineWidth = 1;
                        ctx.strokeRect
