<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゆうすちゃんブロック崩し</title>
    <style>
        body { background-color: #222; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        canvas { 
            background-color: #000; border: 2px solid #555; box-shadow: 0 0 10px rgba(0,0,0,0.5); 
            display: block; margin: 0 auto; cursor: none; touch-action: none; 
            max-width: 100%; height: auto; 
        }
        #restartBtn { display: none; position: absolute; top: 550px; left: 50%; transform: translateX(-50%); padding: 10px 20px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ゆうすちゃんブロック崩し</h1>
    <canvas id="gameCanvas" width="500" height="700"></canvas>
    <button id="restartBtn">やり直す</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const btn = document.getElementById("restartBtn");

        const img1 = new Image(); img2 = new Image(); img3 = new Image();
        img1.src = 'img_01.png'; img2.src = 'img_02.png'; img3.src = 'img_03.png';

        let lives, gameState, paddle, balls, blocks, items, activeBlocks, lastItemSpawnTime, effects, lastTime;
        const paddleBaseWidth = 90;

        function initBall() { balls = [{ x: 250, y: 650, radius: 7, dx: 3, dy: -3 }]; }

        function resetGame() {
            lives = 2; gameState = "START";
            paddle = { height: 12, width: paddleBaseWidth, x: 205, y: 670, dx: 7 };
            initBall();
            items = []; lastItemSpawnTime = Date.now();
            effects = { expandEndTime: 0, penetrateEndTime: 0, rainbowEndTime: 0 };
            lastTime = Date.now();
            
            blocks = []; activeBlocks = 0;
            for(let c=0; c<14; c++) {
                blocks[c] = [];
                for(let r=0; r<20; r++) { blocks[c][r] = { x: c*32+26, y: r*20+150, status: 1 }; activeBlocks++; }
            }
            btn.style.display = "none";
        }
        resetGame();

        // 操作：キーボード
        let keys = { left: false, right: false };
        document.addEventListener("keydown", (e) => {
            if(e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
            if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
            if(gameState === "START" && (keys.right || keys.left)) { gameState = "PLAYING"; lastItemSpawnTime = Date.now(); }
        });
        document.addEventListener("keyup", (e) => {
            if(e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
            if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
        });

        // 操作：スマホ（タッチ）
        canvas.addEventListener("touchmove", (e) => {
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            paddle.x = (touchX / rect.width) * 500 - paddle.width / 2;
            if(gameState === "START") { gameState = "PLAYING"; lastItemSpawnTime = Date.now(); }
            e.preventDefault();
        }, { passive: false });

        btn.onclick = resetGame;

        function draw() {
            let now = Date.now();
            let deltaTime = (now - lastTime) / 16.67; 
            lastTime = now;

            ctx.clearRect(0, 0, 500, 700);

            ctx.drawImage(img1, 0, 0, 500, 600);
            blocks.forEach(col => col.forEach(b => {
                if(b.status) { ctx.lineWidth=1; ctx.strokeStyle="rgba(255,255,255,0.4)"; ctx.strokeRect(b.x, b.y, 32, 20); }
                else { ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, 32, 20); ctx.clip(); ctx.drawImage(img2, 0, 0, 500, 600); ctx.restore(); }
            }));

            if(activeBlocks <= 0) gameState = "CLEAR";

            if(gameState === "GAMEOVER" || gameState === "CLEAR") {
                if(gameState === "GAMEOVER") { ctx.drawImage(img3, 0, 0, 500, 600); ctx.fillStyle="red"; }
                else { ctx.drawImage(img2, 0, 0, 500, 600); ctx.fillStyle="yellow"; }
                ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(gameState === "GAMEOVER" ? "GAME OVER" : "GAME CLEAR!", 250, 350);
                btn.style.display = "block";
            } else {
                let isExpanding = now < effects.expandEndTime;
                paddle.width = isExpanding ? paddleBaseWidth * 1.5 : paddleBaseWidth;
                ctx.fillStyle = isExpanding ? "#32CD32" : "#00FFFF";
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                if(isExpanding && (effects.expandEndTime - now < 5000) && (Math.floor(now / 150) % 2 === 0)) {
                    ctx.fillStyle = "white"; ctx.fillRect(paddle.x, paddle.y, 15, paddle.height); ctx.fillRect(paddle.x + paddle.width - 15, paddle.y, 15, paddle.height);
                }

                items.forEach((it, i) => {
                    if(gameState==="PLAYING") it.y += it.dy * deltaTime;
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.radius, 0, Math.PI*2);
                    ctx.fillStyle = it.type === 'RAINBOW' ? `hsl(${(now/10)%360},100%,50%)` : it.color;
                    ctx.fill(); ctx.fillStyle="white"; ctx.textAlign="center"; ctx.fillText(it.label, it.x, it.y+5);
                    if(it.y + it.radius >= paddle.y && it.x >= paddle.x && it.x <= paddle.x + paddle.width) {
                        if(it.type === 'MULTIPLY') balls.forEach(b => balls.push({x:b.x, y:b.y, radius:7, dx:-b.dx, dy:b.dy}));
                        else if(it.type === 'EXPAND') effects.expandEndTime = now + 60000;
                        else if(it.type === 'PENETRATE') effects.penetrateEndTime = now + 30000;
                        else if(it.type === 'RAINBOW') effects.rainbowEndTime = now + 60000;
                        items.splice(i, 1);
                    } else if(it.y > 700) items.splice(i, 1);
                });

                balls.forEach((b, i) => {
                    if(gameState==="PLAYING") {
                        b.x += b.dx * deltaTime; 
                        b.y += b.dy * deltaTime;
                        if(b.x < 7 || b.x > 493) b.dx *= -1;
                        if(b.y < 7) b.dy *= -1;
                        if(b.y > paddle.y - 7 && b.x > paddle.x && b.x < paddle.x + paddle.width) { b.dy = -Math.abs(b.dy); b.y = paddle.y - 7; }
                        else if(b.y > 700) { balls.splice(i, 1); if(balls.length === 0) { lives--; gameState = lives < 0 ? "GAMEOVER" : "START"; initBall(); } }
                        blocks.forEach(col => col.forEach(bl => {
                            if(bl.status && Math.hypot(b.x-(bl.x+16), b.y-(bl.y+10)) < 18) {
                                bl.status=0; activeBlocks--; if(now > effects.penetrateEndTime) b.dy *= -1;
                            }
                        }));
                    }
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                    ctx.fillStyle = (now < effects.rainbowEndTime) ? `hsl(${(now/5)%360},100%,60%)` : (now < effects.penetrateEndTime ? "#FF4500" : "#FF69B4");
                    ctx.fill();
                    if(now < effects.penetrateEndTime) { ctx.lineWidth=2; ctx.strokeStyle="white"; ctx.stroke(); }
                });

                ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "white"; ctx.textAlign = "left";
                ctx.fillText("HP: " + lives, 20, 30); ctx.textAlign = "right";
                ctx.fillText("残りブロック: " + activeBlocks, 480, 30);
                
                if(keys.right && paddle.x < 500-paddle.width) paddle.x += 7 * deltaTime;
                if(keys.left && paddle.x > 0) paddle.x -= 7 * deltaTime;
                if(gameState==="PLAYING" && now - lastItemSpawnTime > 20000) { 
                    const types = [
                        { type: 'MULTIPLY', color: '#00BFFF', label: '倍' }, { type: 'MULTIPLY', color: '#00BFFF', label: '倍' },
                        { type: 'EXPAND', color: '#32CD32', label: '拡' }, { type: 'PENETRATE', color: '#FF4500', label: '貫' }, { type: 'RAINBOW', color: 'pink', label: '虹' }
                    ];
                    items.push({ x: Math.random() * 460 + 20, y: 0, radius: 15, dy: 2, ...types[Math.floor(Math.random() * types.length)] });
                    lastItemSpawnTime = now; 
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
