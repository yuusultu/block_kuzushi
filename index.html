<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆうすちゃん ブロック崩し</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #instructions {
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            color: #00FFFF;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ゆうすちゃん ブロック崩し</h1>
    <div id="instructions">
        【操作方法】<br>
        左に移動: <span class="highlight">← キー</span> または <span class="highlight">A キー</span><br>
        右に移動: <span class="highlight">→ キー</span> または <span class="highlight">D キー</span><br>
        <br>
        残機: <span id="lives" style="color: #FF69B4; font-size: 18px; font-weight: bold;">3</span>
    </div>
    
    <canvas id="gameCanvas" width="500" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const livesDisplay = document.getElementById("lives");

        // ローディング表示（画像読み込み中）
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.fillText("Now Loading...", canvas.width / 2, canvas.height / 2);
        ctx.font = "14px sans-serif";
        ctx.fillText("※画像サイズが大きい場合、少し時間がかかります", canvas.width / 2, canvas.height / 2 + 30);

        // ==========================================
        // 1. 画像の読み込み処理
        // ==========================================
        const img1 = new Image();
        const img2 = new Image();
        const img3 = new Image();

        let imagesLoaded = 0;
        // 3枚すべての読み込みが終わったらゲームの準備を開始する
        function onImageLoad() {
            imagesLoaded++;
            if(imagesLoaded === 3) {
                draw(); // ゲームループ開始
            }
        }

        img1.onload = onImageLoad;
        img2.onload = onImageLoad;
        img3.onload = onImageLoad;

        img1.src = 'img_01.png'; // 1枚目（服がブロックになる）
        img2.src = 'img_02.png'; // 2枚目（差分・背景）
        img3.src = 'img_03.png'; // 3枚目（失敗時の顔）

        // ==========================================
        // 2. ゲーム変数の設定
        // ==========================================
        let lives = 3;
        let gameState = "START"; 
        
        const paddle = { height: 12, width: 90, x: (canvas.width - 90) / 2, y: canvas.height - 30, dx: 7 };
        const ball = { x: canvas.width / 2, y: canvas.height - 50, radius: 7, dx: 3, dy: -3 };

        const blockRowCount = 8;
        const blockColumnCount = 7;
        const blockWidth = 60;
        const blockHeight = 35;
        const blockPadding = 3;
        const blockOffsetTop = 160;  
        const blockOffsetLeft = 32; 

        let blocks = [];
        for(let c=0; c<blockColumnCount; c++) {
            blocks[c] = [];
            for(let r=0; r<blockRowCount; r++) {
                blocks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = true;
            if(gameState === "START" && (rightPressed || leftPressed)) gameState = "PLAYING";
        });

        document.addEventListener("keyup", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = false;
        });

        // ==========================================
        // 3. 描画・ゲームロジック
        // ==========================================

        function drawBlocks() {
            // ★超重要：元画像の巨大な解像度をキャンバスサイズに合わせる比率
            const scaleX = img1.width / canvas.width;
            const scaleY = img1.height / canvas.height;

            for(let c=0; c<blockColumnCount; c++) {
                for(let r=0; r<blockRowCount; r++) {
                    if(blocks[c][r].status === 1) {
                        let blockX = (c * (blockWidth + blockPadding)) + blockOffsetLeft;
                        let blockY = (r * (blockHeight + blockPadding)) + blockOffsetTop;
                        blocks[c][r].x = blockX;
                        blocks[c][r].y = blockY;

                        // 巨大な元画像から、適切な比率の座標を切り取って描画する
                        ctx.drawImage(img1, 
                            blockX * scaleX, blockY * scaleY, blockWidth * scaleX, blockHeight * scaleY, 
                            blockX, blockY, blockWidth, blockHeight  
                        );
                        
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(blockX, blockY, blockWidth, blockHeight);
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#FF69B4"; 
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y,
