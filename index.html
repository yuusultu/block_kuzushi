<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #instructions {
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            color: #00FFFF;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ブロック崩し</h1>
    <div id="instructions">
        【操作方法】<br>
        左に移動: <span class="highlight">← キー</span> または <span class="highlight">A キー</span><br>
        右に移動: <span class="highlight">→ キー</span> または <span class="highlight">D キー</span><br>
        <br>
        残機: <span id="lives" style="color: #FF69B4; font-size: 18px; font-weight: bold;">3</span>
    </div>
    
    <canvas id="gameCanvas" width="500" height="600"></canvas>

    <script>
        console.log("----- スクリプト実行開始 -----");

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const livesDisplay = document.getElementById("lives");

        let lives = 3;
        let gameState = "START";

        // ==========================================
        // 画像の読み込みとエラーチェック
        // ==========================================
        const img1 = new Image();
        img1.onload = () => console.log("✅ img_01.png 読み込み成功");
        img1.onerror = () => console.error("❌ img_01.png 読み込み失敗");
        img1.src = 'img_01.png';

        const img2 = new Image();
        img2.onload = () => console.log("✅ img_02.png 読み込み成功");
        img2.onerror = () => console.error("❌ img_02.png 読み込み失敗");
        img2.src = 'img_02.png';

        const img3 = new Image();
        img3.onload = () => console.log("✅ img_03.png 読み込み成功");
        img3.onerror = () => console.error("❌ img_03.png 読み込み失敗");
        img3.src = 'img_03.png';

        // ==========================================
        // ゲーム変数の設定
        // ==========================================
        const paddle = { height: 12, width: 90, x: (canvas.width - 90) / 2, y: canvas.height - 30, dx: 7 };
        const ball = { x: canvas.width / 2, y: canvas.height - 50, radius: 7, dx: 3, dy: -3 };

        const blockRowCount = 8;
        const blockColumnCount = 7;
        const blockWidth = 60;
        const blockHeight = 35;
        const blockPadding = 3;
        const blockOffsetTop = 160;
        const blockOffsetLeft = 32;

        let blocks = [];
        for(let c=0; c<blockColumnCount; c++) {
            blocks[c] = [];
            for(let r=0; r<blockRowCount; r++) {
                blocks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = true;
            
            if(gameState === "START" && (rightPressed || leftPressed)) gameState = "PLAYING";
        });

        document.addEventListener("keyup", (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = false;
        });

        // ==========================================
        // 描画・ゲームロジック
        // ==========================================
        function drawBlocks() {
            for(let c=0; c<blockColumnCount; c++) {
                for(let r=0; r<blockRowCount; r++) {
                    if(blocks[c][r].status === 1) {
                        let blockX = (c * (blockWidth + blockPadding)) + blockOffsetLeft;
                        let blockY = (r * (blockHeight + blockPadding)) + blockOffsetTop;
                        blocks[c][r].x = blockX;
                        blocks[c][r].y = blockY;

                        // 画像が正常に読み込まれている場合のみ切り取って描画
                        if(img1.complete && img1.naturalWidth > 0) {
                            ctx.drawImage(img1, blockX, blockY, blockWidth, blockHeight, blockX, blockY, blockWidth, blockHeight);
                        }
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(blockX, blockY, blockWidth, blockHeight);
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#FF69B4";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle
